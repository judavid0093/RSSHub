# Cloudflare Workers Builds must use: wrangler deploy --config wrangler.production.toml
# The cf equivalent is `cf deploy --mode production`, which reads cloudflare.config.ts.
# Keep this file in sync with the production mode of cloudflare.config.ts,
# and delete it once Workers Builds deploys with cf.
name = "rsshub"
main = "dist-worker/worker.mjs"
compatibility_date = "2026-09-01"
compatibility_flags = ["global_fetch_strictly_public", "nodejs_compat", "nodejs_compat_populate_process_env","no_throw_on_not_implemented_tls_options"]

find_additional_modules = true
base_dir = "dist-worker/modules"
rules = [{ type = "Data", globs = ["data_files/**"], fallthrough = true }]

# Serve static assets from lib/assets
assets = { directory = "lib/assets" }

[build]
command = "ulimit -n; pnpm run worker-build"

# Workers Paid plan is recommended for better performance
# Free plan has 10ms CPU time limit per request
# Paid plan has 30s CPU time limit per request

[observability]
enabled = true

# Browser Run API for Playwright support
# Requires Workers Paid plan
[browser]
binding = "BROWSER"

# Share Browser Run sessions across requests and Worker isolates.
[[durable_objects.bindings]]
name = "BROWSER_SESSIONS"
class_name = "BrowserSession"

[[migrations]]
tag = "browser-session-v1"
new_sqlite_classes = ["BrowserSession"]

# KV namespace for caching (auto-provisioned on first deploy)
[[kv_namespaces]]
binding = "CACHE"

[vars]
# Only use the service binding for this endpoint origin.
# Environment variables can be set here or via wrangler secret
# DEBUG_INFO = "false"

# For production, use wrangler secret put <KEY> to set sensitive values
# Example secrets:
# - ACCESS_KEY
# - GITHUB_ACCESS_TOKEN
# - etc.
